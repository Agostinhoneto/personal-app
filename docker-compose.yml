services:
  mysql:
    image: mysql:8.0
    container_name: personal-app-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: personal_app
      MYSQL_USER: personal_app
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - personal-app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-app-laravel
    restart: always
    working_dir: /app
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=personal_app
      - DB_USERNAME=personal_app
      - DB_PASSWORD=password
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - personal-app-network
    command: php artisan serve --host=0.0.0.0 --port=8000

  node:
    image: node:22-alpine
    container_name: personal-app-node
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    networks:
      - personal-app-network
    command: npm run dev

volumes:
  mysql_data:
    driver: local

networks:
  personal-app-network:
    driver: bridge
